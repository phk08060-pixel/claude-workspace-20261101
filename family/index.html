<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 가족을 소개합니다</title>
<meta name="description" content="함께여서 더 따뜻한 세 사람의 이야기">
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="우리 가족을 소개합니다">
<meta property="og:description" content="함께여서 더 따뜻한 세 사람의 이야기">
<meta name="theme-color" content="#c0653f">
<style>
  :root {
    --bg: #fcecd8;
    --card: #fffaf3;
    --text: #2b2723;
    --muted: #7a7168;
    --line: #f0d9bd;
    --accent: #c0653f;
    --accent-soft: #f6e6dc;
    --shadow: 0 6px 24px rgba(60, 40, 20, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #221a14;
      --card: #2c231c;
      --text: #f2ece5;
      --muted: #a89d92;
      --line: #3a332e;
      --accent: #e58a63;
      --accent-soft: #3a2a22;
      --shadow: 0 6px 24px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }

  header {
    text-align: center;
    padding: 72px 0 40px;
  }
  .eyebrow {
    display: inline-block;
    font-size: .85rem;
    letter-spacing: .12em;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 6px 14px;
    border-radius: 999px;
    font-weight: 600;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 3.2rem);
    margin: 18px 0 10px;
    line-height: 1.25;
    letter-spacing: -.02em;
  }
  header p { color: var(--muted); margin: 0; font-size: 1.05rem; }

  section { padding: 28px 0 40px; }
  h2 {
    font-size: 1.3rem;
    margin: 0 0 20px;
    padding-left: 12px;
    border-left: 4px solid var(--accent);
  }

  .members {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px 24px;
    box-shadow: var(--shadow);
    text-align: center;
    transition: transform .2s ease;
  }
  .card:hover { transform: translateY(-4px); }
  .avatar {
    width: 84px; height: 84px;
    margin: 0 auto 16px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 2rem; font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), #e9a27d);
  }
  .card:nth-child(2) .avatar { background: linear-gradient(135deg, #7a6bb0, #b5a8dd); }
  .card:nth-child(3) .avatar { background: linear-gradient(135deg, #3f9a8a, #8bd0c1); }
  .name { font-size: 1.35rem; font-weight: 700; margin: 0; }
  .born { color: var(--muted); font-size: .95rem; margin: 2px 0 18px; }
  dl { margin: 0; text-align: left; border-top: 1px solid var(--line); }
  .row {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 12px 2px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 0; }
  dt { color: var(--muted); font-size: .9rem; flex: none; }
  dd { margin: 0; font-weight: 600; text-align: right; word-break: keep-all; }

  .contact {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 24px;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }
  .contact h3 { margin: 0 0 4px; font-size: .9rem; color: var(--muted); font-weight: 600; }
  .contact p { margin: 0; font-weight: 600; word-break: keep-all; }
  .contact a { color: var(--accent); text-decoration: none; word-break: break-all; }
  .contact a:hover { text-decoration: underline; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: .85rem;
    padding: 24px 0 56px;
  }

  .gb-form {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 24px;
    box-shadow: var(--shadow);
    display: grid;
    gap: 14px;
  }
  .gb-field { display: grid; gap: 6px; }
  .gb-field label { font-size: .9rem; color: var(--muted); font-weight: 600; }
  .gb-field input, .gb-field textarea {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 14px;
  }
  .gb-field textarea { resize: vertical; min-height: 96px; }
  .gb-field input:focus, .gb-field textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .gb-count { justify-self: end; font-size: .8rem; color: var(--muted); }
  .gb-btn {
    justify-self: start;
    font: inherit;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 999px;
    padding: 10px 28px;
    cursor: pointer;
  }
  .gb-btn:hover { filter: brightness(1.06); }
  .gb-btn:disabled, .gb-field input:disabled, .gb-field textarea:disabled { opacity: .55; cursor: not-allowed; }
  .gb-status { margin: 0; min-height: 1.4em; font-size: .9rem; color: var(--muted); }
  .gb-status.error { color: #c0392b; }
  .gb-list { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 14px; }
  .gb-item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 20px;
    box-shadow: var(--shadow);
  }
  .gb-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .gb-author { font-weight: 700; overflow-wrap: anywhere; }
  .gb-time { color: var(--muted); font-size: .8rem; flex: none; }
  .gb-text { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .gb-empty { color: var(--muted); text-align: center; padding: 12px 0; }
  @media (prefers-color-scheme: dark) {
    .gb-btn { color: #2b1a10; }
    .gb-status.error { color: #ff8a7a; }
  }

  @media (max-width: 820px) {
    .members { grid-template-columns: 1fr; max-width: 460px; margin: 0 auto; }
    .contact { grid-template-columns: 1fr; }
    header { padding: 48px 0 24px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">OUR FAMILY</span>
    <h1>우리 가족을 소개합니다</h1>
    <p>함께여서 더 따뜻한 세 사람의 이야기</p>
  </header>

  <main>
    <section aria-labelledby="members-title">
      <h2 id="members-title">가족 구성원</h2>
      <div class="members">

        <article class="card">
          <div class="avatar" aria-hidden="true">희</div>
          <h3 class="name">박희경</h3>
          <p class="born">1972년생</p>
          <dl>
            <div class="row"><dt>직업</dt><dd>회사원</dd></div>
            <div class="row"><dt>직장</dt><dd>신도리코</dd></div>
          </dl>
        </article>

        <article class="card">
          <div class="avatar" aria-hidden="true">성</div>
          <h3 class="name">박성희</h3>
          <p class="born">1978년생</p>
          <dl>
            <div class="row"><dt>직업</dt><dd>드레스 디자이너</dd></div>
            <div class="row"><dt>직장</dt><dd>마리아루이즈</dd></div>
          </dl>
        </article>

        <article class="card">
          <div class="avatar" aria-hidden="true">채</div>
          <h3 class="name">박채은</h3>
          <p class="born">2021년생</p>
          <dl>
            <div class="row"><dt>직업</dt><dd>유치원생</dd></div>
            <div class="row"><dt>학교</dt><dd>서울베네딕도유치원</dd></div>
          </dl>
        </article>

      </div>
    </section>

    <section aria-labelledby="contact-title">
      <h2 id="contact-title">연락처</h2>
      <div class="contact">
        <div>
          <h3>이메일</h3>
          <p><a href="mailto:phk08060@naver.com">phk08060@naver.com</a></p>
        </div>
        <div>
          <h3>지역</h3>
          <p>서울 성북구</p>
        </div>
      </div>
    </section>

    <section aria-labelledby="guestbook-title">
      <h2 id="guestbook-title">방명록</h2>
      <form id="gb-form" class="gb-form" autocomplete="off">
        <div class="gb-field">
          <label for="gb-name">이름</label>
          <input id="gb-name" name="name" type="text" maxlength="30" required placeholder="이름을 적어 주세요">
        </div>
        <div class="gb-field">
          <label for="gb-content">남기고 싶은 말</label>
          <textarea id="gb-content" name="content" maxlength="500" required placeholder="따뜻한 한마디를 남겨 주세요"></textarea>
          <span id="gb-count" class="gb-count">0 / 500</span>
        </div>
        <button id="gb-submit" class="gb-btn" type="submit">남기기</button>
        <p id="gb-status" class="gb-status" role="status" aria-live="polite"></p>
      </form>
      <ul id="gb-list" class="gb-list" aria-label="방명록 글 목록"></ul>
    </section>
  </main>

  <footer>© 박씨 가족 · 2026</footer>
</div>

<!-- 로컬: scripts/dev_server.py 가 .env.local 값으로 /config.js 를 만들어 줍니다. 파일이 없으면 방명록만 꺼져요. -->
<script src="/config.js"></script>
<script>
(function () {
  var cfg = window.SUPABASE_CONFIG;
  var form = document.getElementById('gb-form');
  var nameInput = document.getElementById('gb-name');
  var contentInput = document.getElementById('gb-content');
  var countEl = document.getElementById('gb-count');
  var submitBtn = document.getElementById('gb-submit');
  var statusEl = document.getElementById('gb-status');
  var listEl = document.getElementById('gb-list');

  function setStatus(message, isError) {
    statusEl.textContent = message;
    statusEl.className = 'gb-status' + (isError ? ' error' : '');
  }

  contentInput.addEventListener('input', function () {
    countEl.textContent = contentInput.value.length + ' / 500';
  });

  if (!cfg || !cfg.url || !cfg.anonKey) {
    setStatus('방명록 설정을 찾을 수 없어요. 로컬에서는 python scripts/dev_server.py 로 열어 주세요.', true);
    Array.prototype.forEach.call(form.elements, function (el) { el.disabled = true; });
    return;
  }

  var endpoint = cfg.url.replace(/\/$/, '') + '/rest/v1/messages';
  var authHeaders = { apikey: cfg.anonKey, Authorization: 'Bearer ' + cfg.anonKey };

  function render(rows) {
    listEl.replaceChildren();
    if (!rows.length) {
      var empty = document.createElement('li');
      empty.className = 'gb-empty';
      empty.textContent = '아직 남겨진 글이 없어요. 첫 번째 글을 남겨 주세요!';
      listEl.appendChild(empty);
      return;
    }
    rows.forEach(function (row) {
      var li = document.createElement('li');
      li.className = 'gb-item';

      var meta = document.createElement('div');
      meta.className = 'gb-meta';
      var author = document.createElement('span');
      author.className = 'gb-author';
      author.textContent = row.name;
      var time = document.createElement('time');
      time.className = 'gb-time';
      time.dateTime = row.created_at;
      time.textContent = new Date(row.created_at).toLocaleString('ko-KR', {
        year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'
      });
      meta.appendChild(author);
      meta.appendChild(time);

      var text = document.createElement('p');
      text.className = 'gb-text';
      text.textContent = row.content;

      li.appendChild(meta);
      li.appendChild(text);
      listEl.appendChild(li);
    });
  }

  async function load() {
    var res = await fetch(endpoint + '?select=id,name,content,created_at&order=created_at.desc&limit=50', { headers: authHeaders });
    if (!res.ok) throw new Error('load ' + res.status);
    render(await res.json());
  }

  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    var name = nameInput.value.trim();
    var content = contentInput.value.trim();
    if (!name || !content) {
      setStatus('이름과 내용을 모두 적어 주세요.', true);
      return;
    }
    submitBtn.disabled = true;
    setStatus('남기는 중…', false);
    try {
      var res = await fetch(endpoint, {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }, authHeaders),
        body: JSON.stringify({ name: name, content: content })
      });
      if (!res.ok) throw new Error('post ' + res.status);
      contentInput.value = '';
      countEl.textContent = '0 / 500';
      setStatus('남겨 주셔서 고마워요!', false);
      await load();
    } catch (err) {
      setStatus('글을 남기지 못했어요. 잠시 후 다시 시도해 주세요.', true);
    } finally {
      submitBtn.disabled = false;
    }
  });

  load().catch(function () {
    setStatus('방명록을 불러오지 못했어요. (테이블이 아직 없거나 연결에 문제가 있을 수 있어요)', true);
  });
})();
</script>
</body>
</html>
